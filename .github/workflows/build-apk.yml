{"name": "Bangun APK Kas Kita", "on": ["push", "workflow_dispatch"], "jobs": {"apk": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-node@v4", "with": {"node-version": 22, "cache": "npm"}}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": 21}}, {"name": "Pasang pustaka", "run": "npm ci"}, {"name": "Bangun tampilan web", "run": "npm run build"}, {"name": "Buat proyek Android", "run": "npx cap add android\npip install pillow\npython3 prepare_android.py\nnpx cap sync android"}, {"name": "Bangun APK", "working-directory": "android", "run": "chmod +x gradlew\n./gradlew assembleDebug --no-daemon"}, {"name": "Ganti nama file", "run": "cp android/app/build/outputs/apk/debug/app-debug.apk Kas-Kita.apk"}, {"name": "Simpan APK", "uses": "actions/upload-artifact@v4", "with": {"name": "Kas-Kita-APK", "path": "Kas-Kita.apk", "retention-days": 30}}]}}}
